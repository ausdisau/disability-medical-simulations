<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Rohan complex-airway training scene</title>
  <desc id="desc">A neutral illustrated paediatric hospital room with Rohan supported in bed, an AAC display reading STOP SOMETHING IS WRONG, a monitor, a ventilator circuit and a separate emergency equipment station.</desc>
  <rect width="1200" height="700" fill="#eaf0f5"/>
  <rect x="48" y="45" width="1104" height="610" rx="32" fill="#ffffff" stroke="#b8c7d4" stroke-width="6"/>
  <rect x="155" y="365" width="650" height="150" rx="28" fill="#d9e4ec" stroke="#94a8b9" stroke-width="6"/>
  <rect x="220" y="300" width="220" height="100" rx="24" fill="#f8fbfd" stroke="#94a8b9" stroke-width="5"/>
  <circle cx="505" cy="350" r="48" fill="#b88068"/>
  <path d="M470 405 C535 382 650 392 754 470" fill="none" stroke="#234a70" stroke-width="78" stroke-linecap="round"/>
  <path d="M548 379 C620 348 750 350 832 420" fill="none" stroke="#147d78" stroke-width="18" stroke-linecap="round"/>
  <rect x="70" y="125" width="330" height="190" rx="20" fill="#ffffff" stroke="#1e67a8" stroke-width="8"/>
  <text x="235" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#172333">STOP</text>
  <text x="235" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172333">SOMETHING IS WRONG</text>
  <rect x="900" y="115" width="205" height="175" rx="18" fill="#10263d"/>
  <path d="M925 205 L950 205 L966 170 L986 238 L1008 190 L1032 205 L1075 205" fill="none" stroke="#58d68d" stroke-width="8"/>
  <text x="1002" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">TREND, NOT TRUTH</text>
  <rect x="895" y="355" width="220" height="185" rx="22" fill="#f7fafc" stroke="#a66a10" stroke-width="6"/>
  <text x="1005" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172333">AIRWAY KIT</text>
  <text x="1005" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#607085">AVAILABLE</text>
  <text x="1005" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#607085">NOT YET INDICATED</text>
  <circle cx="855" cy="300" r="42" fill="#6a7a89"/>
  <path d="M855 345 L855 505" stroke="#6a7a89" stroke-width="42" stroke-linecap="round"/>
  <circle cx="125" cy="545" r="42" fill="#244f74"/>
  <path d="M125 590 L125 650" stroke="#244f74" stroke-width="42" stroke-linecap="round"/>
</svg>
