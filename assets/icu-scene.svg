<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Accessible ICU respiratory simulation</title>
  <desc id="description">Stylised adult in an ICU bed using an AAC screen that says I NEED SUCTION, with clinicians, monitor and family nearby.</desc>
  <rect width="1200" height="700" fill="#e9eef3"/>
  <rect x="45" y="55" width="1110" height="580" rx="28" fill="#f9fbfc" stroke="#b9c8d5" stroke-width="5"/>
  <rect x="160" y="360" width="660" height="145" rx="30" fill="#dce5ec" stroke="#9dafbd" stroke-width="6"/>
  <rect x="230" y="300" width="220" height="95" rx="25" fill="#fff" stroke="#9dafbd" stroke-width="5"/>
  <circle cx="510" cy="350" r="50" fill="#c9987e"/>
  <path d="M470 405 C520 380 650 390 755 470" fill="none" stroke="#264f77" stroke-width="75" stroke-linecap="round"/>
  <path d="M555 380 C620 350 760 350 825 420" fill="none" stroke="#147d78" stroke-width="18" stroke-linecap="round"/>
  <rect x="70" y="155" width="300" height="180" rx="18" fill="#fff" stroke="#1e67a8" stroke-width="8"/>
  <text x="220" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#172333">I NEED</text>
  <text x="220" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#172333">SUCTION</text>
  <rect x="885" y="115" width="210" height="180" rx="18" fill="#10263d"/>
  <path d="M910 205 L940 205 L960 160 L985 240 L1010 185 L1040 205 L1070 205" fill="none" stroke="#54d38a" stroke-width="8"/>
  <g fill="#244f74"><circle cx="150" cy="555" r="42"/><circle cx="930" cy="420" r="42"/><circle cx="1035" cy="455" r="42"/></g>
  <g stroke="#244f74" stroke-width="42" stroke-linecap="round"><path d="M150 600 L150 655"/><path d="M930 465 L930 570"/><path d="M1035 500 L1035 590"/></g>
  <g fill="#6a7a89"><circle cx="785" cy="120" r="40"/><circle cx="1085" cy="360" r="38"/></g>
  <g stroke="#6a7a89" stroke-width="40" stroke-linecap="round"><path d="M785 165 L785 290"/><path d="M1085 405 L1085 505"/></g>
